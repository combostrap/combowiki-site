version: '3'

tasks:
  # Update this repo with the copier-template
  # `--vcs-ref HEAD` to avoid `You are downgrading from 0.1.0.post2.dev0+0a9a33e to 0.1.0. Downgrades are not supported.`
  update:
    cmds:
      - |
        copier update --vcs-ref HEAD .
  # Create and run the container
  run:
    cmds:
      - |
        docker run \
          --name combowiki-site \
          -d \
          -p 8082:80 \
          --user 1000:1000 \
          -e DOKU_DOCKER_ENV=dev \
          -e DOKU_DOCKER_ACL_POLICY='public' \
          -e DOKU_DOCKER_ADMIN_NAME='admin' \
          -e DOKU_DOCKER_ADMIN_PASSWORD='welcome' \
          -v $PWD:/var/www/html \
          ghcr.io/combostrap/dokuwiki:php8.3-2026-07-14a
  # Stop the container
  stop:
    cmds:
      - |
        docker stop combowiki-site
  # Rm the container
  rm:
    cmds:
      - |
        docker rm combowiki-site
  # Start the container
  start:
    cmds:
      - |
        docker start combowiki-site
  # Indexer
  index:
    cmds:
      - |
        docker exec -it combowiki-site php ./bin/indexer.php --clear
  # Broken links
  broken:
    cmds:
      - |
        # indexer is needed otherwise the sync will delete frontmatter meta that are not in the database
        docker exec -it combowiki-site php ./bin/indexer.php
        # Delete non-existing pages in the database
        docker exec -it combowiki-site php ./bin/plugin.php combo sync /
        docker exec -it combowiki-site php ./bin/plugin.php combo broken-links
  # Frontmatter (index first!)
  frontmatter:
    cmds:
      - |
        docker exec -it combowiki-site php ./bin/plugin.php combo metadata-to-frontmatter :
